name: forge-pr

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target project (only longshot for now)"
        required: true
        type: choice
        options: [longshot]
        default: longshot
      action:
        description: "push = branch to the magicbean fork only; create = push + open WIP PR; update / comment / ready / status = on PR number"
        required: true
        type: choice
        options: [push, create, update, comment, ready, status]
      branch:
        description: "Branch on juliotec/L-Upstream (push, create, update with push)"
        required: false
        type: string
        default: ""
      number:
        description: "PR number on MagicBeanDev/Longshot (update, comment, ready, status)"
        required: false
        type: string
        default: ""
      title:
        description: "PR title, Conventional Commit (create)"
        required: false
        type: string
        default: ""
      body:
        description: "PR description in markdown (create, update)"
        required: false
        type: string
        default: ""
      comment:
        description: "Comment text (update, comment)"
        required: false
        type: string
        default: ""

concurrency:
  group: forge-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    env:
      LONGSHOT_TEAM_CHAT_DIR: ${{ github.workspace }}/.forge-session
      MAGICBEAN_TOOLING: ${{ github.workspace }}/Tooling
      FORGE_USER: jcabarca
      FORK_URL: https://git.magicbean.dev/jcabarca/Longshot.git
      ACTION: ${{ inputs.action }}
      BRANCH: ${{ inputs.branch }}
      NUMBER: ${{ inputs.number }}
      TITLE: ${{ inputs.title }}
      BODY: ${{ inputs.body }}
      COMMENT: ${{ inputs.comment }}
    steps:
      - name: Check the inputs
        run: |
          case "$ACTION" in
            push|create) [ -n "$BRANCH" ] || { echo "branch is required"; exit 1; } ;;
            update|comment|ready|status) [ -n "$NUMBER" ] || { echo "number is required"; exit 1; } ;;
          esac
          [ "$ACTION" != create ] || [ -n "$TITLE" ] || { echo "title is required"; exit 1; }
          case "$ACTION" in comment|update) [ -n "$COMMENT" ] || { echo "comment is required"; exit 1; } ;; esac

      - name: Longshot's scripts (longshot-main)
        uses: actions/checkout@v4
        with:
          ref: longshot-main
          path: tools

      - name: The fix branch
        if: inputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 0

      - name: MagicBeanDev/Tooling (forge.py, team_chat.py)
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$FORGE_USER" "$MAGICBEAN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$MAGICBEAN_TOOLING"
          git -C "$MAGICBEAN_TOOLING" log -1 --format='Tooling @ %h %s'

      - name: Sign in to git.magicbean.dev
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          mkdir -p "$LONGSHOT_TEAM_CHAT_DIR"
          python3 -I -c "import json,os,sys; json.dump({'access_token':os.environ['MAGICBEAN_TOKEN'],'expires_at':4102444800,'login':os.environ['FORGE_USER'],'refresh_token':None}, open(sys.argv[1],'w'))" "$LONGSHOT_TEAM_CHAT_DIR/forge.json"
          chmod 600 "$LONGSHOT_TEAM_CHAT_DIR/forge.json"

      - name: Push the branch to the magicbean fork
        if: inputs.branch != '' && (inputs.action == 'push' || inputs.action == 'create' || inputs.action == 'update')
        working-directory: src
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$FORGE_USER" "$MAGICBEAN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force "$FORK_URL" "HEAD:refs/heads/$BRANCH"

      - name: PR on MagicBeanDev/Longshot
        if: inputs.action != 'push'
        working-directory: tools
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          case "$ACTION" in
            create)
              if [ -n "$BODY" ]; then
                python3 -I scripts/forge.py pr create "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
              else
                python3 -I scripts/forge.py pr create "$BRANCH" --title "$TITLE"
              fi ;;
            update)
              set -- pr update "$NUMBER"
              [ -z "$BODY" ] || set -- "$@" --body-file "$RUNNER_TEMP/body.md"
              [ -z "$COMMENT" ] || set -- "$@" --comment "$COMMENT"
              python3 -I scripts/forge.py "$@" ;;
            comment) python3 -I scripts/forge.py pr comment "$NUMBER" "$COMMENT" ;;
            ready)   python3 -I scripts/forge.py pr ready "$NUMBER" ;;
            status)  python3 -I scripts/forge.py pr status "$NUMBER" ;;
          esac

      - name: Forget the session
        if: always()
        run: rm -rf "$LONGSHOT_TEAM_CHAT_DIR"
