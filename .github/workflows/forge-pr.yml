name: forge-pr

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target project (only longshot for now)"
        required: true
        type: choice
        options: [longshot]
        default: longshot
      action:
        description: "push = branch to the magicbean fork only; create = push + open WIP PR; update / comment / ready / status / reviews = on PR number; search = PRs and issues for query; batch = batch.json on branch"
        required: true
        type: choice
        options: [push, create, update, comment, ready, status, reviews, search, audit, batch]
      branch:
        description: "Branch on juliotec/L-Upstream (push, create, update with push)"
        required: false
        type: string
        default: ""
      number:
        description: "PR number on MagicBeanDev/Longshot (update, comment, ready, status, reviews; audit: the highest number to check)"
        required: false
        type: string
        default: ""
      title:
        description: "PR title, Conventional Commit (create)"
        required: false
        type: string
        default: ""
      body:
        description: "PR description in markdown (create, update)"
        required: false
        type: string
        default: ""
      comment:
        description: "Comment text (update, comment)"
        required: false
        type: string
        default: ""
      tested_in_game:
        description: "Where the change ran in the game and what was seen (create)"
        required: false
        type: string
        default: ""
      query:
        description: "Search terms, several split by | (search)"
        required: false
        type: string
        default: ""

concurrency:
  group: forge-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    env:
      LONGSHOT_TEAM_CHAT_DIR: ${{ github.workspace }}/.forge-session
      MAGICBEAN_TOOLING: ${{ github.workspace }}/Tooling
      FORGE_USER: jcabarca
      FORK_URL: https://git.magicbean.dev/jcabarca/Longshot.git
      ACTION: ${{ inputs.action }}
      BRANCH: ${{ inputs.branch }}
      NUMBER: ${{ inputs.number }}
      TITLE: ${{ inputs.title }}
      BODY: ${{ inputs.body }}
      COMMENT: ${{ inputs.comment }}
      TESTED_IN_GAME: ${{ inputs.tested_in_game }}
      QUERY: ${{ inputs.query }}
    steps:
      - name: Check the inputs
        run: |
          case "$ACTION" in
            push|create|batch) [ -n "$BRANCH" ] || { echo "branch is required"; exit 1; } ;;
            update|comment|ready|status|reviews|audit) [ -n "$NUMBER" ] || { echo "number is required"; exit 1; } ;;
            search) [ -n "$QUERY" ] || { echo "query is required"; exit 1; } ;;
          esac
          [ "$ACTION" != create ] || [ -n "$TITLE" ] || { echo "title is required"; exit 1; }
          case "$ACTION" in comment|update) [ -n "$COMMENT" ] || { echo "comment is required"; exit 1; } ;; esac

      - name: Longshot's scripts (longshot-main)
        uses: actions/checkout@v4
        with:
          ref: longshot-main
          path: tools

      - name: The fix branch
        if: inputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: src
          fetch-depth: 0

      - name: MagicBeanDev/Tooling (forge.py, team_chat.py)
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$FORGE_USER" "$MAGICBEAN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$MAGICBEAN_TOOLING"
          git -C "$MAGICBEAN_TOOLING" log -1 --format='Tooling @ %h %s'
          git -C tools remote set-url origin https://git.magicbean.dev/MagicBeanDev/Longshot.git

      - name: Sign in to git.magicbean.dev
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          mkdir -p "$LONGSHOT_TEAM_CHAT_DIR"
          python3 -I -c "import json,os,sys; json.dump({'access_token':os.environ['MAGICBEAN_TOKEN'],'expires_at':4102444800,'login':os.environ['FORGE_USER'],'refresh_token':None}, open(sys.argv[1],'w'))" "$LONGSHOT_TEAM_CHAT_DIR/forge.json"
          chmod 600 "$LONGSHOT_TEAM_CHAT_DIR/forge.json"

      - name: Push the branch to the magicbean fork
        if: inputs.branch != '' && (inputs.action == 'push' || inputs.action == 'create' || inputs.action == 'update')
        working-directory: src
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$FORGE_USER" "$MAGICBEAN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force "$FORK_URL" "HEAD:refs/heads/$BRANCH"

      - name: PR on MagicBeanDev/Longshot
        if: inputs.action != 'push' && inputs.action != 'reviews' && inputs.action != 'search' && inputs.action != 'audit' && inputs.action != 'batch'
        working-directory: tools
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          case "$ACTION" in
            create)
              set -- pr create "$BRANCH" --title "$TITLE"
              [ -z "$BODY" ] || set -- "$@" --body-file "$RUNNER_TEMP/body.md"
              [ -z "$TESTED_IN_GAME" ] || set -- "$@" --tested-in-game "$TESTED_IN_GAME"
              python3 -I scripts/forge.py "$@" ;;
            update)
              set -- pr update "$NUMBER"
              [ -z "$BODY" ] || set -- "$@" --body-file "$RUNNER_TEMP/body.md"
              [ -z "$COMMENT" ] || set -- "$@" --comment "$COMMENT"
              python3 -I scripts/forge.py "$@" ;;
            comment) python3 -I scripts/forge.py pr comment "$NUMBER" "$COMMENT" ;;
            ready)   python3 -I scripts/forge.py pr ready "$NUMBER" ;;
            status)  python3 -I scripts/forge.py pr status "$NUMBER" ;;
          esac

      # (every review, each comment on the code with its file, line and diff, and every PR comment, in full)
      - name: Reviews and comments on the PR
        if: inputs.action == 'reviews'
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        shell: python3 -I {0}
        run: |
          import json, os, urllib.error, urllib.request
          api = "https://git.magicbean.dev/api/v1/repos/MagicBeanDev/Longshot"
          n = os.environ["NUMBER"]
          def get(path):
              out, page = [], 1
              while True:
                  sep = "&" if "?" in path else "?"
                  req = urllib.request.Request("%s%s%spage=%d&limit=50" % (api, path, sep, page),
                                               headers={"Authorization": "token " + os.environ["MAGICBEAN_TOKEN"],
                                                        "Accept": "application/json", "User-Agent": "longshot-forge-pr"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          got = json.load(r)
                  except urllib.error.HTTPError as e:
                      raise SystemExit("%s: HTTP %s %s" % (req.full_url, e.code, e.read()[:500].decode("utf-8", "replace")))
                  if not isinstance(got, list):
                      return got
                  out += got
                  if len(got) < 50:
                      return out
                  page += 1
          pr = get("/pulls/%s" % n)
          print("#%s %s (%s, head %s)" % (n, pr.get("title"), pr.get("state"), (pr.get("head") or {}).get("sha", "")[:8]))
          print("\n== PR description")
          print(pr.get("body") or "")
          for rv in get("/pulls/%s/reviews" % n):
              print("\n== review %s by %s, %s, %s (commit %s)" % (rv["id"], (rv.get("user") or {}).get("login"),
                    rv.get("state"), rv.get("submitted_at"), (rv.get("commit_id") or "")[:8]))
              if rv.get("body"):
                  print(rv["body"])
              for c in get("/pulls/%s/reviews/%s/comments" % (n, rv["id"])):
                  print("\n-- %s:%s (old line %s) by %s, %s%s" % (c.get("path"), c.get("position"), c.get("original_position"),
                        (c.get("user") or {}).get("login"), c.get("created_at"),
                        ", resolved by %s" % (c.get("resolver") or {}).get("login") if c.get("resolver") else ", not resolved"))
                  if c.get("diff_hunk"):
                      print(c["diff_hunk"])
                  print(">> " + (c.get("body") or "").replace("\n", "\n>> "))
          print("\n== PR comments")
          for c in get("/issues/%s/comments" % n):
              print("\n-- %s, %s" % ((c.get("user") or {}).get("login"), c.get("created_at")))
              print(c.get("body") or "")
          print("\n== timeline (events other than comments)")
          for ev in get("/issues/%s/timeline" % n):
              if ev.get("type") == "comment":
                  continue
              print("-- %s by %s, %s%s" % (ev.get("type"), (ev.get("user") or {}).get("login"), ev.get("created_at"),
                    (": " + ev["body"][:200]) if ev.get("body") else ""))

      # (our open PRs numbered up to number: mergeable, the head commit's checks, reviews and comments, in one run)
      - name: Audit our open PRs
        if: inputs.action == 'audit'
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        shell: python3 -I {0}
        run: |
          import json, os, urllib.error, urllib.request
          api = "https://git.magicbean.dev/api/v1/repos/MagicBeanDev/Longshot"
          top = int(os.environ["NUMBER"])
          def get(path, many=True):
              out, page = [], 1
              while True:
                  sep = "&" if "?" in path else "?"
                  url = "%s%s%spage=%d&limit=50" % (api, path, sep, page) if many else api + path
                  req = urllib.request.Request(url, headers={"Authorization": "token " + os.environ["MAGICBEAN_TOKEN"], "Accept": "application/json", "User-Agent": "longshot-forge-pr"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          got = json.load(r)
                  except urllib.error.HTTPError as e:
                      return {"error": "HTTP %s %s" % (e.code, e.read()[:300].decode("utf-8", "replace"))}
                  if not isinstance(got, list) or not many:
                      return got
                  out += got
                  if len(got) < 50:
                      return out
                  page += 1
          prs = [p for p in get("/pulls?state=open") if (p.get("user") or {}).get("login") == os.environ["FORGE_USER"] and p["number"] <= top]
          print("%d open PRs by %s numbered up to %d: %s" % (len(prs), os.environ["FORGE_USER"], top, " ".join("#%d" % p["number"] for p in sorted(prs, key=lambda p: p["number"]))))
          for p in sorted(prs, key=lambda p: p["number"]):
              n = p["number"]
              full = get("/pulls/%d" % n, many=False)
              sha = (full.get("head") or {}).get("sha", "")
              print("\n\n######## #%d %s" % (n, full.get("title")))
              print("head %s (%s), base %s, mergeable %s, draft %s, updated %s" % (sha[:8], (full.get("head") or {}).get("ref"), (full.get("base") or {}).get("ref"), full.get("mergeable"), full.get("draft"), full.get("updated_at")))
              st = get("/commits/%s/status" % sha, many=False)
              print("== checks: combined %s" % st.get("state"))
              for s in st.get("statuses") or []:
                  print("-- %s: %s: %s %s" % (s.get("context"), s.get("status") or s.get("state"), s.get("description"), s.get("target_url") or ""))
              for rv in get("/pulls/%d/reviews" % n):
                  if not isinstance(rv, dict) or "id" not in rv:
                      continue
                  print("\n== review %s by %s, %s, %s (commit %s)%s" % (rv["id"], (rv.get("user") or {}).get("login"), rv.get("state"), rv.get("submitted_at"), (rv.get("commit_id") or "")[:8], ", stale" if rv.get("stale") else ""))
                  if rv.get("body"):
                      print(rv["body"])
                  for c in get("/pulls/%d/reviews/%s/comments" % (n, rv["id"])):
                      if not isinstance(c, dict):
                          continue
                      print("-- %s:%s by %s, %s%s" % (c.get("path"), c.get("position"), (c.get("user") or {}).get("login"), c.get("created_at"), ", resolved" if c.get("resolver") else ", not resolved"))
                      print(">> " + (c.get("body") or "").replace("\n", "\n>> "))
              print("\n== PR comments")
              for c in get("/issues/%d/comments" % n):
                  if not isinstance(c, dict):
                      continue
                  print("\n-- %s, %s" % ((c.get("user") or {}).get("login"), c.get("created_at")))
                  print(c.get("body") or "")

      # (PRs and issues on MagicBeanDev/Longshot, open, closed and merged, for each term of query split on |)
      - name: Search PRs and issues (forge.py search)
        if: inputs.action == 'search'
        continue-on-error: true
        run: |
          f="$MAGICBEAN_TOOLING/scripts/forge.py"
          if ! python3 -I "$f" search --help > /dev/null 2>&1; then echo "forge.py has no search: the API search below is the only one"; exit 0; fi
          IFS='|' read -ra terms <<< "$QUERY"
          for t in "${terms[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -n "$t" ] || continue
            echo "== forge.py search: $t"
            python3 -I "$f" --repo MagicBeanDev/Longshot search --state all "$t" || echo "forge.py search failed for: $t"
          done

      - name: Search PRs and issues (API)
        if: inputs.action == 'search'
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        shell: python3 -I {0}
        run: |
          import json, os, urllib.error, urllib.parse, urllib.request
          api = "https://git.magicbean.dev/api/v1/repos/MagicBeanDev/Longshot"
          for term in [t.strip() for t in os.environ["QUERY"].split("|") if t.strip()]:
              print("\n== API search: %s" % term)
              hits = 0
              for page in range(1, 5):
                  req = urllib.request.Request("%s/issues?state=all&limit=50&page=%d&q=%s" % (api, page, urllib.parse.quote(term)),
                                               headers={"Authorization": "token " + os.environ["MAGICBEAN_TOKEN"],
                                                        "Accept": "application/json", "User-Agent": "longshot-forge-pr"})
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          got = json.load(r)
                  except urllib.error.HTTPError as e:
                      raise SystemExit("%s: HTTP %s" % (req.full_url, e.code))
                  for i in got:
                      pr = i.get("pull_request")
                      state = "merged" if pr and pr.get("merged") else i.get("state")
                      print("%s %s %s %s" % ("PR" if pr else "issue", state, i.get("html_url"), i.get("title")))
                  hits += len(got)
                  if len(got) < 50:
                      break
              print("(%d hits)" % hits)

      # (several PRs in one run: batch.json on the branch named by branch, a list of {number, branch, body, comment, ready, close};
      #  a forge head holding commits by someone else is not overwritten: that PR is skipped and its commits listed)
      - name: Batch of PR updates
        if: inputs.action == 'batch'
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        shell: python3 -I {0}
        run: |
          import base64, json, os, subprocess, urllib.request
          auth = base64.b64encode(("%s:%s" % (os.environ["FORGE_USER"], os.environ["MAGICBEAN_TOKEN"])).encode()).decode()
          print("::add-mask::" + auth)
          hdr = ["-c", "http.extraheader=AUTHORIZATION: basic " + auth]
          me = "juliotec2@hotmail.com"
          src = os.path.abspath("src")
          tools = os.path.abspath("tools")
          items = json.load(open(os.path.join(src, "batch.json"), encoding="utf-8"))
          def git(*a, check=True):
              r = subprocess.run(["git", "-C", src] + list(a), capture_output=True, text=True)
              if check and r.returncode:
                  raise RuntimeError("git %s: %s" % (a[-2] if len(a) > 1 else a[0], r.stderr.strip()[-500:]))
              return r
          git("fetch", "--quiet", "origin", "+refs/heads/longshot-main:refs/batch/main")
          failed = []
          for it in items:
              n, b = str(it["number"]), it.get("branch") or ""
              print("\n######## #%s %s" % (n, b), flush=True)
              try:
                  if b:
                      git("fetch", "--quiet", "origin", "+refs/heads/%s:refs/batch/ours" % b)
                      r = git(*hdr, "fetch", "--quiet", os.environ["FORK_URL"], "+refs/heads/%s:refs/batch/forge" % b, check=False)
                      if r.returncode == 0:
                          new = git("log", "--no-merges", "--format=%h %ae %s", "refs/batch/forge", "^refs/batch/ours", "^refs/batch/main").stdout.splitlines()
                          foreign = [x for x in new if x.split(" ")[1] != me]
                          if foreign:
                              print("the forge head has commits by someone else; not pushed, not updated:")
                              print("\n".join(foreign))
                              failed.append(n)
                              continue
                      else:
                          print("no forge branch yet: " + r.stderr.strip()[-300:])
                      git(*hdr, "push", "--force", os.environ["FORK_URL"], "refs/batch/ours:refs/heads/" + b)
                      print("pushed " + git("rev-parse", "--short=8", "refs/batch/ours").stdout.strip(), flush=True)
                  cmd = ["python3", "-I", "scripts/forge.py", "pr", "update", n]
                  if it.get("body"):
                      f = os.path.join(os.environ["RUNNER_TEMP"], "body-%s.md" % n)
                      open(f, "w", encoding="utf-8").write(it["body"])
                      cmd += ["--body-file", f]
                  if it.get("comment"):
                      cmd += ["--comment", it["comment"]]
                  if len(cmd) > 6:
                      r = subprocess.run(cmd, cwd=tools, capture_output=True, text=True)
                      print(r.stdout + r.stderr, flush=True)
                      if r.returncode:
                          failed.append(n)
                          continue
                  if it.get("ready"):
                      r = subprocess.run(["python3", "-I", "scripts/forge.py", "pr", "ready", n], cwd=tools, capture_output=True, text=True)
                      print(r.stdout + r.stderr, flush=True)
                      if r.returncode:
                          failed.append(n)
                  if it.get("close"):
                      req = urllib.request.Request("https://git.magicbean.dev/api/v1/repos/MagicBeanDev/Longshot/pulls/" + n, method="PATCH",
                                                  data=json.dumps({"state": "closed"}).encode(),
                                                  headers={"Authorization": "Basic " + auth, "Content-Type": "application/json"})
                      with urllib.request.urlopen(req) as resp:
                          print("closed #%s: %s %s" % (n, resp.status, json.load(resp).get("state")), flush=True)
              except Exception as e:
                  print("error: %s" % e)
                  failed.append(n)
          print("\nfailed: " + (" ".join("#" + x for x in failed) or "none"))
          if failed:
              raise SystemExit(1)

      - name: Forget the session
        if: always()
        run: rm -rf "$LONGSHOT_TEAM_CHAT_DIR"
