# Fork only (juliotec/Longshot-Upstream): copies MagicBeanDev/Longshot's main to longshot-main and
# MagicBeanDev/LongshotLauncher's main to launcher-main, unchanged,
# for machines that cannot reach git.magicbean.dev. It never touches main, so it starts no nightly.
name: Mirror Longshot main
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-longshot
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy main to longshot-main
        run: |
          set -eu
          git init -q mirror
          cd mirror
          git fetch --no-tags https://git.magicbean.dev/MagicBeanDev/Longshot.git +refs/heads/main:refs/heads/main
          echo "MagicBeanDev/Longshot main: $(git rev-parse main)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:refs/heads/longshot-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the launcher's main to launcher-main
        run: |
          set -eu
          git init -q launcher
          cd launcher
          git fetch --no-tags https://git.magicbean.dev/MagicBeanDev/LongshotLauncher.git +refs/heads/main:refs/heads/main
          echo "MagicBeanDev/LongshotLauncher main: $(git rev-parse main)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:refs/heads/launcher-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
