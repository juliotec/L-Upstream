name: team-chat

on:
  workflow_dispatch:
    inputs:
      action:
        description: "post = send message; read = print the room's latest messages to the log"
        required: false
        type: choice
        options:
          - post
          - read
        default: post
      message:
        description: "Text to post (several fixes in one message; empty for read)"
        required: false
        type: string
        default: ""
      limit:
        description: "read: how many messages (default 20)"
        required: false
        type: string
        default: "20"
      room:
        description: "Room alias (empty = #agent-updates:magicbean.dev)"
        required: false
        type: string
        default: ""

concurrency:
  group: team-chat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      LONGSHOT_TEAM_CHAT_DIR: ${{ github.workspace }}/.team-chat
      MAGICBEAN_TOOLING: ${{ github.workspace }}/Tooling
      FORGE_USER: jcabarca
    steps:
      - uses: actions/checkout@v4
        with:
          ref: longshot-main

      - name: Restore last post time
        uses: actions/cache/restore@v4
        with:
          path: .team-chat
          key: team-chat-${{ github.run_id }}
          restore-keys: team-chat-

      - name: MagicBeanDev/Tooling (forge.py, team_chat.py)
        env:
          MAGICBEAN_TOKEN: ${{ secrets.MAGICBEAN_TOKEN }}
        run: |
          auth=$(printf '%s:%s' "$FORGE_USER" "$MAGICBEAN_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --depth 1 https://git.magicbean.dev/MagicBeanDev/Tooling.git "$MAGICBEAN_TOOLING"
          git -C "$MAGICBEAN_TOOLING" log -1 --format='Tooling @ %h %s'

      - name: Sign in
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: printf '%s\n' "$MATRIX_TOKEN" | python3 -I "$MAGICBEAN_TOOLING/scripts/team_chat.py" login --access-token-stdin

      - name: Read
        if: inputs.action == 'read'
        env:
          ROOM: ${{ inputs.room }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$ROOM" ]; then
            python3 -I "$MAGICBEAN_TOOLING/scripts/team_chat.py" read --limit "${LIMIT:-20}" --room "$ROOM"
          else
            python3 -I "$MAGICBEAN_TOOLING/scripts/team_chat.py" read --limit "${LIMIT:-20}"
          fi

      - name: Post
        if: inputs.action != 'read'
        env:
          MESSAGE: ${{ inputs.message }}
          ROOM: ${{ inputs.room }}
        run: |
          if [ -n "$ROOM" ]; then
            python3 -I "$MAGICBEAN_TOOLING/scripts/team_chat.py" post "$MESSAGE" --room "$ROOM"
          else
            python3 -I "$MAGICBEAN_TOOLING/scripts/team_chat.py" post "$MESSAGE"
          fi

      - name: Drop the token
        if: always()
        run: |
          f=.team-chat/team_chat.json
          [ -f "$f" ] && python3 -I -c "import json,sys; p=sys.argv[1]; c=json.load(open(p)); [c.pop(k,None) for k in ('access_token','device_id')]; json.dump(c,open(p,'w'))" "$f" || true

      - name: Save last post time
        if: success() && inputs.action != 'read'
        uses: actions/cache/save@v4
        with:
          path: .team-chat
          key: team-chat-${{ github.run_id }}
