# longshot-builder for Linux (docs/dev/reference/builder.md, "What a release carries"): longshot-builder-<version>-linux-x64, one program
# (linked against glibc 2.35, tools.lock's sysroot, the game's own floor; the dist profile: scripts/longshot_builder.py) that carries everything a player's PC builds the game with: the
# sources, the release's third-party objects, RenHDrum's library and the build tools (tools.lock's linux-x64 bundle),
# unpacked into its cache at the first use (build-driver's sources.rs). Built in Ubuntu 22.04, the oldest system the game
# it builds is for (glibc 2.35: RenHDrum's library is linked here). No game data is involved.
# Called by release.yml with the version's name, it also makes the deltas from the channel's last releases and the
# release's manifest for this platform (`longshot-builder dev release files`) and RecompLauncher's zip (`dev release
# recomplauncher`), and uploads them. The program is compiled once: before its pack is attached
# (`dev release attach`) it is this job's tool for all of it, and build-windows.yml's (an artifact). It runs only on the server's
# release runner (scripts/ci_release_runner.sh), checks tools.lock with that builder before anything is uploaded, and
# restores only the release's own caches: downloads, each checked by its SHA-256 when used, and for a run of main or a
# v* tag the builder's compiled Rust (docs/dev/reference/ci.md, The release's cache). It carries the version, so a tag
# always builds it again. The back end's build checks, which ship nothing, are CI's (ci.yml's renderer job), not a
# release's.
name: longshot-builder (Linux)
on:
  # (called by the Release workflow only, with the version's name)
  workflow_call:
    inputs:
      tag:
        description: the version's name (v3.1.0, nightly-<count>-<commit>); its files are uploaded
        type: string
        required: true
      ref:
        description: the commit to build
        type: string
        required: true
permissions:
  contents: read
env:
  # (the version this run is for, from the Release workflow)
  RELEASE_TAG: ${{ inputs.tag }}
concurrency:
  group: longshot-builder-linux-${{ inputs.tag }}

jobs:
  # (named to pair with release.yml's job that calls this workflow, which Forgejo lists beside it)
  linux:
    name: "longshot-builder (Linux): build"
    runs-on: release  # (a release's build: only the runners kept for them take it, docs/dev/reference/ci.md)
    container: ubuntu:22.04
    # (about 4 minutes with the dependencies cached; building them all, as a release does, takes longer)
    timeout-minutes: 60
    steps:
      # (dpkg without an fsync per file: this container is thrown away after the job, so an install cut short loses nothing)
      - name: Package installs without fsync
        run: echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/force-unsafe-io
      # (git for the version, curl and xz for the downloads, zstd for the pack and the deltas (1.4.8: --patch-from), Python
      # for the scripts, gcc for RenHDrum's link, against this glibc (2.35))
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for try in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl xz-utils zstd python3 \
              build-essential && break
            [ "$try" = 3 ] && exit 1
            echo "::notice::the package install failed: trying again in 20 s ($try of 3)"
            sleep 20
          done

      # (Node for the actions this job uses, which are JavaScript (checkout, upload-artifact: `using: node24`): the
      # runner starts them with the job container's own `node`, and ubuntu:22.04 has none (exec: "node": executable file
      # not found, the first nightly's run). Ubuntu 22.04's own nodejs is version 12, too old for them; this is Node.js's
      # Linux build, pinned by its SHA-256, only its node program, before the first action)
      - name: Node for the actions
        env:
          NODE_VER: v24.22.3
          NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
        run: |
          node_tar="$RUNNER_TEMP/node.tar.xz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 --proto '=https' -o "$node_tar" \
            "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-linux-x64.tar.xz"
          echo "$NODE_SHA256  $node_tar" | sha256sum -c --quiet -
          tar -xJf "$node_tar" -C /usr/local --strip-components=1 "node-$NODE_VER-linux-x64/bin/node"
          rm -f "$node_tar"
          node --version

      - name: Check out the commit, with its history
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # (the release's commit; with its history, git describe names a build that is no release)
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # (the server's release runner only: scripts/ci_release_runner.sh; docs/dev/reference/ci.md, Runners)
      - name: The server's release runner
        env:
          SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
        run: scripts/ci_release_runner.sh

      - name: Version
        run: echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # (the release's own cache, of downloads only: the pinned Rust's archives, Cargo.lock's .crate files, tools.lock's
      # archives. Each is checked by its SHA-256 every time it is used, against the pins in this checkout, so
      # whoever saved the cache can't change what is built; nothing unpacked or compiled is kept. Read and written only by a
      # run of main or a v* tag (docs/dev/reference/ci.md, The release's cache))
      - name: Restore the release's downloads (each checked by its SHA-256 when used)
        id: release-cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust/*.tar.xz
            ${{ runner.temp }}/rust/crates
            ${{ runner.temp }}/tools-cache
            ${{ runner.temp }}/link-tools/.cache
          key: release-downloads-linux-${{ hashFiles('Cargo.lock', 'third_party/renhdrum/Cargo.lock', 'scripts/renhdrum.py', 'tools.lock') }}
          restore-keys: release-downloads-linux-
      # (the pinned Rust (scripts/renhdrum.py's RUST) and Cargo.lock's crates, each checked by its SHA-256, into
      # $RUNNER_TEMP/rust, which RenHDrum's build below takes too)
      # (the compiled Rust of the shipped builder's compile: cargo's target folder, kept for trusted runs only (a run of
      # main or a v* tag, on the server's release runner), by platform, profile, target and the pinned Rust
      # (scripts/renhdrum.py), then Cargo.lock; another Cargo.lock restores the newest entry of the same toolchain.
      # Unlike the downloads above, what it holds is not checked again: docs/dev/reference/ci.md, The release's cache)
      # (what links it, before there is a builder to install tools with: tools.lock's linux-x64 llvm and sysroot from
      # Longshot's store, each archive checked by its size and SHA-256, unpacked into $RUNNER_TEMP/link-tools)
      - name: The linker and sysroot (tools.lock, linux-x64)
        run: python3 -I scripts/longshot_builder.py link-tools "$RUNNER_TEMP/link-tools"
      - name: Restore the shipped builder's compiled Rust (main's and tags' runs only)
        id: rust-target
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-work/target
          key: release-rust-target-linux-dist-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/renhdrum.py') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-rust-target-linux-dist-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/renhdrum.py') }}-
      # (the program this release ships, the dist profile, compiled once, before it carries anything: linked by tools.lock's
      # clang (lld) against tools.lock's sysroot, glibc 2.35, the game's floor, which the build checks. Until its pack is attached
      # it is this job's tool: it installs the tools, makes the third-party objects from the checkout (--root), packs what
      # the release carries, runs the dry run, makes the deltas and the manifest (`dev release`); build-windows.yml takes
      # it too, uploaded below)
      - name: longshot-builder-<version>-linux-x64, before its pack
        run: >-
          python3 -I scripts/longshot_builder.py build --target linux --profile dist --cache "$RUNNER_TEMP/rust"
          --out "$RUNNER_TEMP/host/longshot-builder" --jobs "$(nproc)"
          --linker "$RUNNER_TEMP/link-tools/llvm/bin/clang" --sysroot "$RUNNER_TEMP/link-tools/sysroot"
      - name: Save the shipped builder's compiled Rust (main's and tags' runs only)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-target.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-work/target
          key: release-rust-target-linux-dist-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/renhdrum.py') }}-${{ hashFiles('Cargo.lock') }}

      # (every tool the Windows and the Linux builder carry is in tools.lock, every line's first URLs Longshot's store's,
      # and every line's archive there with its size and SHA-256: checked here, with the builder above, before anything
      # is uploaded. A release uploads no tool: a line whose archive is not there yet is the Make tools workflow's to make
      # and upload. publish needs both builds, so a refusal here ships nothing)
      - name: The tools
        run: |
          TOOLS="$RUNNER_TEMP/host/longshot-builder dev tools"
          if ! $TOOLS check; then
            echo "::error::tools.lock lacks a tool a builder needs; docs/dev/reference/releases.md, Bumping a tool"
            exit 1
          fi
          if ! $TOOLS check --require; then
            echo "::error::a tools.lock line's archive is not in Longshot's store (above): a release uploads no tool. Run the Make tools workflow (Actions > Make tools, on main) for it, or fix the line; docs/dev/reference/releases.md, Bumping a tool"
            exit 1
          fi

      # (tools.lock's linux-x64 bundle: each tool from Longshot's packages, checked by its SHA-256, unpacked at
      # tools/<name>/ of the checkout (`longshot-builder dev tools install`, by the longshot-builder above: the builder
      # needs none of these tools to be built), where longshot-builder --root <checkout> takes them
      # (build-driver's tools))
      - name: The build tools (tools.lock, linux-x64)
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev tools install "$PWD" --system linux-x64 --cache "$RUNNER_TEMP/tools-cache"
          echo "BUNDLE=$PWD" >> "$GITHUB_ENV"

      # (the third-party code's objects a player's build takes instead of compiling them (build-compile's prebuilt.rs),
      # made with the bundle's tools, as a player's build compiles them.
      # Each object whose key (the compiler, the flags, the source, every header it read) is the channel's newest
      # release's is taken from that release, its SHA256SUMS signature checked first (`dev release last-objects`): the
      # same bytes, so the pack's member and the deltas stay the same; the rest are compiled. None to be had: all compiled)
      - name: The third-party objects
        env:
          FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release last-objects --version "$TAG" --platform linux-x64 \
            --out "$RUNNER_TEMP/last-objects"
          last="$RUNNER_TEMP/last-objects/objects/third_party_objects"
          [ -f "$last/set.json" ] || last=0
          LONGSHOT_THIRD_PARTY_OBJECTS="$last" "$RUNNER_TEMP/host/longshot-builder" compile \
            --work "$RUNNER_TEMP/third-party-work" --root "$PWD" --store "$RUNNER_TEMP/third-party-work/store" \
            --jobs "$(nproc)" --third-party-objects "$RUNNER_TEMP/third_party_objects"

      # (the game's Rust, longshot-rs over game/crates: liblongshot_rs.a with the pinned Rust, and beside it the key of the
      # sources it was built from, which a player's build checks before it links it instead of compiling Rust:
      # build-compile's rust.rs)
      - name: liblongshot_rs.a
        run: |
          python3 -I scripts/longshot_builder.py game-rust --target linux --cache "$RUNNER_TEMP/rust" \
            --out "$RUNNER_TEMP/longshot-rs/linux-x64"
          "$RUNNER_TEMP/host/longshot-builder" dev rust-key --root "$PWD" > "$RUNNER_TEMP/longshot-rs/linux-x64/sources.key"

      # (RenHDrum (host/rumble_renhdrum.c): renhdrum.so from third_party/renhdrum with scripts/renhdrum.py's pinned Rust,
      # linked here against glibc 2.35; a player's build puts it beside the game)
      - name: renhdrum.so
        run: >-
          python3 -I scripts/renhdrum.py build --target linux --linker gcc --cache "$RUNNER_TEMP/rust"
          --out "$RUNNER_TEMP/renhdrum/renhdrum.so"

      # (saved as soon as the last download is made (RenHDrum's Rust and crates, above), not at the job's end: a later
      # step that fails then leaves the next run its downloads all the same)
      - name: Save the release's downloads (each checked by its SHA-256 when used)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.release-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust/*.tar.xz
            ${{ runner.temp }}/rust/crates
            ${{ runner.temp }}/tools-cache
            ${{ runner.temp }}/link-tools/.cache
          key: release-downloads-linux-${{ hashFiles('Cargo.lock', 'third_party/renhdrum/Cargo.lock', 'scripts/renhdrum.py', 'tools.lock') }}

      # (what the program carries: the sources, the objects, RenHDrum's library, the tools, each part a zstd member of its
      # own (`longshot-builder dev release sources`), several compressed at once; each member whose raw bytes and zstd
      # are the last release's is taken from that release's pack, kept by `dev release last-objects` above after its
      # signed SHA256SUMS were checked (--reuse), the bytes compressing it again would give; then a copy of the program
      # with it appended and read back (`dev release attach`), and that copy's headers checked: x86-64, glibc 2.35 at most, glibc's libraries only (its windows
      # load X11 or Wayland at run time))
      - name: longshot-builder-<version>-linux-x64
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release sources --out "$RUNNER_TEMP/sources.pack" --version "$TAG" \
            --third-party-objects "$RUNNER_TEMP/third_party_objects" \
            --add "longshot-rs/prebuilt/linux-x64/liblongshot_rs.a=$RUNNER_TEMP/longshot-rs/linux-x64/liblongshot_rs.a" \
            --add "longshot-rs/prebuilt/linux-x64/sources.key=$RUNNER_TEMP/longshot-rs/linux-x64/sources.key" \
            --add "third_party/renhdrum/renhdrum.so=$RUNNER_TEMP/renhdrum/renhdrum.so" --tools "$BUNDLE/tools" \
            --reuse "$RUNNER_TEMP/last-objects/sources.pack"
          "$RUNNER_TEMP/host/longshot-builder" dev release attach "$RUNNER_TEMP/host/longshot-builder" \
            "$RUNNER_TEMP/sources.pack" --out "dist/longshot-builder-$TAG-linux-x64"
          python3 -I scripts/longshot_builder.py check "dist/longshot-builder-$TAG-linux-x64"
          ls -l dist

      # (a player's build from the program itself, with no game and nothing beside it, up to where the lifted game is
      # needed: what it carries unpacked into an empty cache, then its compile's dry run with and without AMD FSR 4: a file
      # the program does not carry, or a third-party object a player's build would compile, fails here)
      - name: A player's build from the program
        run: >-
          "$RUNNER_TEMP/host/longshot-builder" dev release dry-run "dist/longshot-builder-$TAG-linux-x64" --clean
          --cache "$RUNNER_TEMP/player-cache" --work "$RUNNER_TEMP/dry"

      # (the release's stamps, the deltas from its channel's last releases and its manifest for linux-x64; the bases are
      # fetched through RELEASE_UPLOAD_API, the server without Cloudflare, when this runner reaches it, else as anyone does)
      - name: The deltas and the manifest
        env:
          FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: >-
          "$RUNNER_TEMP/host/longshot-builder" dev release files "dist/longshot-builder-$TAG-linux-x64" --version "$TAG"
          --platform linux-x64 --work "$RUNNER_TEMP/release"

      # (RecompLauncher's release file: the same program as Longshot.x86_64, and recomplauncher.json, zipped by the
      # job's longshot-builder into dist/, so it travels with the rest and SHA256SUMS names it: the deploy runner, which
      # signs, builds and runs no Rust)
      - name: longshot-builder-<version>-linux-x64-recomplauncher.zip
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release recomplauncher "dist/longshot-builder-$TAG-linux-x64" --out dist
          ls -l dist

      # (an artifact goes to Forgejo by its public address, ROOT_URL, behind Cloudflare, whatever address the runner has: a
      # request there can fail once, and the action does not send a block again (2026-11-13, the launcher's nightly: one
      # 8 MB block, "SSL alert bad record mac"). Sent once more when it failed: Forgejo takes the same name again)
      # (the uploads through the server's own address, RELEASE_UPLOAD_API's host on this runner's network, not git.magicbean.dev
      # behind Cloudflare, which cut a 306 MB upload with "tls alert bad record mac" (release run 54507): upload-artifact
      # talks to ACTIONS_RESULTS_URL, given here per step. When that fails, or the variable is unset, the upload goes the
      # usual way, then once more)
      # (zipped stored, compression-level 0: dist/ is compressed already (the program is mostly its zstd pack, the deltas
      # are zstd, RecompLauncher's zip holds the program), and zipping its 300 MB again at the default level took minutes
      # of the runner's 2 cores for almost nothing. The tool, the program before its pack, is a plain program that zips to about half:
      # level 1, the fastest)
      - name: The server's own address, for the uploads
        id: direct
        env:
          UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          if [[ $UPLOAD_API == http*://*/api/v1* ]]; then
            echo "url=${UPLOAD_API%%/api/v1*}/" >> "$GITHUB_OUTPUT"
            echo "uploads through ${UPLOAD_API%%/api/v1*}"
          else
            echo "::notice::no RELEASE_UPLOAD_API: the uploads go through the public address"
          fi
      - name: Upload longshot-builder-linux, through the server's own address
        id: upload_1_direct
        if: steps.direct.outputs.url != ''
        continue-on-error: true
        env:
          ACTIONS_RESULTS_URL: ${{ steps.direct.outputs.url }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload longshot-builder-linux
        id: upload_1
        if: steps.direct.outputs.url == '' || steps.upload_1_direct.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload longshot-builder-linux (again, the first try having failed)
        if: steps.upload_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux
          path: dist/
          if-no-files-found: error
          compression-level: 0
      # (the program before its pack: build-windows.yml's tool, not a release file (publish takes the artifact above only))
      - name: Upload longshot-builder-linux-tool, through the server's own address
        id: upload_tool_1_direct
        if: steps.direct.outputs.url != ''
        continue-on-error: true
        env:
          ACTIONS_RESULTS_URL: ${{ steps.direct.outputs.url }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux-tool
          path: ${{ runner.temp }}/host/longshot-builder
          if-no-files-found: error
          compression-level: 1
      - name: Upload longshot-builder-linux-tool
        id: upload_tool_1
        if: steps.direct.outputs.url == '' || steps.upload_tool_1_direct.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux-tool
          path: ${{ runner.temp }}/host/longshot-builder
          if-no-files-found: error
          compression-level: 1
      - name: Upload longshot-builder-linux-tool (again, the first try having failed)
        if: steps.upload_tool_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-linux-tool
          path: ${{ runner.temp }}/host/longshot-builder
          if-no-files-found: error
          compression-level: 1
