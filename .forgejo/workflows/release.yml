# Longshot's releases (docs/dev/reference/releases.md; how to make one: "Making a release" there). The same workflow as MagicBeanDev/LongshotLauncher's,
# but for what is built: here longshot-builder, one self-contained program per platform.
#
#   a push to main       the nightly: nightly-<commits since the fork>-<commit>, a pre-release, 5 minutes after the last of a few
#                        merges in a row (at once when the newest nightly is an hour old, so at least once an hour)
#                        and none when the commits since the nightly before put nothing on its page (ci:, chore:)
#   a tag vX.Y.Z         a stable (the stable channel), on a tested nightly's commit. Longshot's first is v3.0.0
#
# 1. version: the version's name first; a tag is checked too (Tooling's scripts/release.py check-tag: its form, on main,
#    above every release, and as high as the commits since the last stable call for). A refused tag builds nothing.
#    tools.lock is checked by each build job (`longshot-builder dev tools check --require`, with the builder it builds
#    anyway: every tool the Windows and the Linux builder carry has its line, and every line's archive is in Longshot's
#    store with its size and SHA-256), before it uploads anything; publish needs both builds, so a refusal ships nothing.
#    A release only downloads the pinned tools: the Make tools workflow (tools.yml, started by hand) makes and uploads
#    them, never a release.
#    A tag on a commit CI has released already (for a stable, the nightly of its commit) reuses none of its files: each
#    carries its version (the VERSION in what longshot-builder carries), and a release never ships a file that names
#    another version. The back end's build checks, which ship no file, are CI's (ci.yml's renderer job), not a release's.
#    The builds take every tool from the store (`longshot-builder dev tools install`) into what longshot-builder carries.
# 2. linux, windows (build-linux.yml, build-windows.yml), per platform p (linux-x64, windows-x64):
#    longshot-builder-<v>-<p> (.exe on Windows), the deltas to it from the channel's last 5 releases,
#    longshot-builder-<from>-to-<v>-<p>.zst-patch, its manifest, longshot-builder-<v>-<p>.json, and RecompLauncher's
#    longshot-builder-<v>-<p>-recomplauncher.zip (the program as Longshot.exe or Longshot.x86_64, and recomplauncher.json)
#    (`longshot-builder dev release files` and `recomplauncher`, run by the Linux job's longshot-builder before its pack
#    is attached; windows runs after linux and takes that program as its tool), uploaded. They run only on the server's release runner (scripts/ci_release_runner.sh) and restore
#    only the release's own cache, of downloads each checked by its SHA-256 when used (docs/dev/reference/ci.md).
# 3. publish: SHA256SUMS over the builds' files and tools.lock, SHA256SUMS.sig (the release key), the notes (git-cliff,
#    cliff.toml), then a draft release with every file, published last: until then no launcher sees it. A nightly also
#    prunes the nightlies past the newest 20 that are 5 days old or more. Nothing is committed back to the repository.
#
# Secret (docs/dev/reference/releases.md, One-time setup): RELEASE_SIGNING_KEY_SEALED (the release key's private PEM, sealed:
# scripts/ci_secret.sh). version and publish run on the runner kept for them (runs-on: deploy); publish gets the seal.key
# that opens it from the seal broker, which hands it to a run of main or a v* tag only; the builds run on the server's
# release runner only (docs/dev/reference/ci.md, Runners). publish compiles no Rust and runs no program the checkout builds: what
# they sign or upload was made and checked elsewhere, and each secret (the sealed ones, the job's token) is given only to
# the steps that use it, never to the job.
# Releases are made with the job's own token (forgejo.token, passed to Tooling's scripts/release.py as RELEASE_TOKEN; no secret, no bot account): on a push to this repository Forgejo gives it write access to this repository's every
# unit (routers/api/v1/permissions/repo_access.go), so it may make, upload to, publish and delete releases and delete tags
# here, and nowhere else. No `permissions:` key: Forgejo 17 ignores it (with a warning). Variable: RELEASE_UPLOAD_API (passed to release.py as FORGEJO_UPLOAD_API; Forgejo reserves the FORGEJO_ prefix for variables), the
# API's address without Cloudflare in front, when a file is larger than its 100 MB upload limit.
# release.py is Tooling's (MagicBeanDev/Tooling, scripts/release.py), cloned at the commit .tooling-rev names: a change to the
# release is a Tooling pull request, then a pull request here that moves .tooling-rev to it.
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: The version
    runs-on: deploy  # (only the runner kept for deploys and releases: the version and commit it names are what is built and signed)
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - name: Check out the commit, with its history
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none   # (history without file contents: the server sends commits and trees only; files come when read)
          persist-credentials: false
      - name: Tooling's release.py, at the commit .tooling-rev names
        run: |
          git clone -q https://git.magicbean.dev/MagicBeanDev/Tooling.git "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" checkout -q --detach "$(cat .tooling-rev)"
          echo "RELEASE_PY=$RUNNER_TEMP/tooling/scripts/release.py" >> "$GITHUB_ENV"
      - name: The version's name (on a push to main, a wait of 5 minutes for more merges first, unless the last nightly is an hour old)
        id: name
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
          FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          git fetch -q --tags origin main
          ref=$(git rev-parse HEAD)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            python3 -I "$RELEASE_PY" check-tag "$tag" --main origin/main
          else
            # (merges in a row build one nightly: the release runs queue one at a time, and a nightly whose commit is still
            # main's waits 5 minutes for more. One whose commit is no longer main's, then or before, skips: the newer one
            # builds. Unless the newest nightly is an hour old: then it neither waits nor skips, so while merges keep coming a
            # nightly still comes out each hour, and one after a quiet hour starts at once.
            # The wait is on the quick runner, which has room for it (MagicBeanDev/Infra, runner/quick/config.yml))
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              age=$(python3 -I "$RELEASE_PY" nightly-age) || age=none   # (no answer: it builds)
              if [[ $age != none ]] && (( age >= 3600 )); then
                echo "::notice::the newest nightly is an hour old (${age}s): this one builds now, with no wait for more merges"
              elif [[ $(git rev-parse origin/main) == "$ref" ]]; then
                echo "::notice::waiting 5 minutes for more merges before naming the nightly (main is still at ${ref:0:12})"
                for minute in 1 2 3 4 5; do
                  sleep 60
                  echo "waited ${minute} of 5 minutes for more merges"
                done
                git fetch -q origin main
              fi
              head=$(git rev-parse origin/main)
              if [[ $head != "$ref" ]]; then
                if [[ $age != none ]] && (( age < 3600 )); then
                  echo "::notice::main has moved on to ${head:0:8}: this nightly skips, the newer one builds"
                  echo "tag=" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::notice::main has moved on to ${head:0:8}, but the newest nightly is an hour old (${age}s): this one builds"
              fi
            fi
            # (a nightly whose page would list nothing new since the nightly before, only ci: or chore: commits, is not
            # made: the next one comes with what follows. git-cliff decides, as for the notes; no answer: it builds)
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              news=yes
              if cliff=$(python3 -I "$RELEASE_PY" git-cliff "$RUNNER_TEMP/cliff"); then
                news=$(GIT_CLIFF=$cliff python3 -I "$RELEASE_PY" nightly-news) || news=yes
              fi
              if [[ $news == no ]]; then
                echo "::notice::nothing for the notes since the newest nightly (ci: or chore: commits only): no nightly"
                echo "tag=" >> "$GITHUB_OUTPUT"
                echo "ref=$ref" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            tag=$(python3 -I "$RELEASE_PY" nightly-name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$tag, from $ref"

  linux:
    name: longshot-builder (Linux)
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.forgejo/workflows/build-linux.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}

  windows:
    name: longshot-builder (Windows)
    # (after linux: its longshot-builder, before its pack, is this job's tool, so a release compiles the builder once per
    # platform)
    needs: [version, linux]
    if: needs.version.outputs.tag != ''
    uses: ./.forgejo/workflows/build-windows.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}

  publish:
    name: Sign and publish
    needs: [version, linux, windows]
    if: needs.version.outputs.tag != ''
    runs-on: deploy  # (the runner kept for deploys and releases, on the seal broker's network; docs/dev/reference/ci.md)
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    enable-openid-connect: true   # (the ID token the seal broker checks: this job only)
    timeout-minutes: 60
    env:
      SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
      TAG: ${{ needs.version.outputs.tag }}
      REF: ${{ needs.version.outputs.ref }}
      FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
    steps:
      - name: Check out the commit, with its history
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          filter: blob:none   # (history without file contents: the server sends commits and trees only; files come when read)
          persist-credentials: false
      - name: Tooling's release.py, at the commit .tooling-rev names
        run: |
          git clone -q https://git.magicbean.dev/MagicBeanDev/Tooling.git "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" checkout -q --detach "$(cat .tooling-rev)"
          echo "RELEASE_PY=$RUNNER_TEMP/tooling/scripts/release.py" >> "$GITHUB_ENV"
      # (the programs, deltas and manifests from Forgejo's own address, RELEASE_UPLOAD_API on this runner's network, where the artifacts are on its
      # disk: through its public address behind Cloudflare, as download-artifact fetches them, they came at about 1 MB/s,
      # two of this job's three minutes (nightly-325). When that fails (no variable, an API that answers otherwise), the
      # download-artifact steps below fetch them as before)
      - id: artifacts
        name: The files, from Forgejo's own address
        continue-on-error: true
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: python3 -I "$RELEASE_PY" artifacts files --run "$GITHUB_RUN_ID" longshot-builder-linux longshot-builder-windows
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - name: Download longshot-builder-linux (when Forgejo's own address gave nothing)
        id: download_1
        if: steps.artifacts.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: longshot-builder-linux
          path: files
      - name: Download longshot-builder-linux (again, the first try having failed)
        if: steps.artifacts.outcome == 'failure' && steps.download_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: longshot-builder-linux
          path: files
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - name: Download longshot-builder-windows (when Forgejo's own address gave nothing)
        id: download_2
        if: steps.artifacts.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: longshot-builder-windows
          path: files
      - name: Download longshot-builder-windows (again, the first try having failed)
        if: steps.artifacts.outcome == 'failure' && steps.download_2.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: longshot-builder-windows
          path: files
      # (each platform's program, manifest and RecompLauncher zip, made by its build job: this runner builds and runs no
      # program of the checkout's, it only signs and publishes files)
      - name: The files
        run: |
          git fetch -q --tags origin
          cp tools.lock files/
          ls -l files
          for p in linux-x64 windows-x64; do
            exe=; [ "$p" = windows-x64 ] && exe=.exe
            for f in "longshot-builder-$TAG-$p$exe" "longshot-builder-$TAG-$p.json" "longshot-builder-$TAG-$p-recomplauncher.zip"; do
              test -s "files/$f" || { echo "::error::the builds made no $f (or an empty one)"; exit 1; }
            done
          done
      - name: SHA256SUMS, signed
        env:
          SEALED: ${{ secrets.RELEASE_SIGNING_KEY_SEALED }}
        run: |
          python3 -I "$RELEASE_PY" sums files/* --out files/SHA256SUMS
          umask 077
          # (the key is sealed: only the seal broker's seal.key opens it, for main and v* tags, scripts/ci_secret.sh. Removed
          # however the step ends: a failed signing leaves no key on the runner)
          trap 'rm -f "$RUNNER_TEMP/key.pem"' EXIT
          printf '%s' "$SEALED" | scripts/ci_secret.sh unseal > "$RUNNER_TEMP/key.pem"
          python3 -I "$RELEASE_PY" sign files/SHA256SUMS --key "$RUNNER_TEMP/key.pem" --out files/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # (checked with the key the launcher is built with, not the one just used: a key it does not trust stops here)
          python3 -I "$RELEASE_PY" verify files/SHA256SUMS --files files
          cat files/SHA256SUMS
      - name: The notes
        run: |
          GIT_CLIFF=$(python3 -I "$RELEASE_PY" git-cliff "$RUNNER_TEMP/cliff")
          export GIT_CLIFF
          python3 -I "$RELEASE_PY" notes "$TAG" --out notes.md
          cat notes.md
      - name: Publish
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: python3 -I "$RELEASE_PY" publish "$TAG" --target "$REF" --notes notes.md files/*
      - name: Prune the nightlies
        if: startsWith(needs.version.outputs.tag, 'nightly-')
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
        run: python3 -I "$RELEASE_PY" prune --keep 20 --keep-days 5
