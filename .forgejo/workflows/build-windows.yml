# longshot-builder for Windows (docs/dev/reference/builder.md, "What a release carries"): longshot-builder-<version>-windows-x64.exe, one program
# (x86_64-pc-windows-gnullvm, the dist profile: scripts/longshot_builder.py, with llvm-mingw) that carries everything a
# player's PC builds the game with: the sources, the release's third-party objects, RenHDrum's DLL and the build tools
# (tools.lock's windows-x64 bundle), unpacked into its cache at the first use (build-driver's sources.rs). No game data is
# involved. Called by release.yml with the version's name, it also makes the deltas from the channel's last releases, the
# release's manifest and RecompLauncher's zip for this platform, all uploaded. It restores only the release's own caches
# (docs/dev/reference/ci.md, The release's cache). Players build the Windows Vulkan back end on their PC; that it still
# builds is CI's check (ci.yml's renderer job), not a release's.
# Every job runs on a Linux runner (label release): there is no Windows one (docs/dev/reference/ci.md). Everything is
# cross-compiled with llvm-mingw's Linux build of tools.lock's release (scripts/longshot_builder.py llvm-mingw, pinned in builder/tools/pins.sh);
# the Linux job's longshot-builder (build-linux.yml's program before its pack, an artifact: release.yml runs this job
# after that one) is this job's tool, so no builder is compiled for it: it makes the third-party objects and the pack,
# and appends the pack to the Windows program, which is compiled once; that is started under Wine.
name: longshot-builder (Windows)

on:
  # (called by the Release workflow only, with the version's name)
  workflow_call:
    inputs:
      tag:
        description: the version's name (v3.1.0, nightly-<count>-<commit>); its files are uploaded
        type: string
        required: true
      ref:
        description: the commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  # (the version this run is for, from the Release workflow)
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  # (a fixed name: when called, github.workflow is the caller's)
  group: build-windows-${{ inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  # (named to pair with release.yml's job that calls this workflow, which Forgejo lists beside it)
  package:
    name: "longshot-builder (Windows): build"
    runs-on: release  # (a release's build: only the runners kept for them take it, docs/dev/reference/ci.md)
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # (the version is git describe's: the tags and the history since them)
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: https://github.com/actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # (the server's release runner only: scripts/ci_release_runner.sh; docs/dev/reference/ci.md, Runners)
      - name: The server's release runner
        env:
          SEAL_BROKER_PIN: ${{ vars.SEAL_BROKER_PIN }}
        run: scripts/ci_release_runner.sh

      # (Wine starts the program and the dav1d test; its apt, about 30 s, runs in the background beside the build steps,
      # and "Wine, installed" waits for it. Detached, so this step ends at once; its status is written last, whole, by mv)
      - name: Wine (installed in the background)
        run: |
          # shellcheck disable=SC2016   # ($1: the inner shell's, single-quoted on purpose)
          setsid nohup bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends wine64 xvfb xauth zstd
            echo $? > "$1.tmp" && mv "$1.tmp" "$1.status"' wine "$RUNNER_TEMP/wine-apt" \
            > "$RUNNER_TEMP/wine-apt.log" 2>&1 < /dev/null &

      - name: llvm-mingw version
        id: llvm
        run: echo "name=$(python -I scripts/longshot_builder.py llvm-mingw --name --host linux)" >> "$GITHUB_OUTPUT"
      # (the release's own cache, of downloads only: the pinned Rust's archives, Cargo.lock's .crate files, tools.lock's
      # archives, llvm-mingw. Each is checked by its SHA-256 every time it is used, against the pins in this checkout, so
      # whoever saved the cache can't change what is built; nothing unpacked or compiled is kept. Read and written only by a
      # run of main or a v* tag (docs/dev/reference/ci.md, The release's cache))
      - name: Restore the release's downloads (each checked by its SHA-256 when used)
        id: release-cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust/*.tar.xz
            ${{ runner.temp }}/rust/crates
            ${{ runner.temp }}/tools-cache
            ${{ runner.temp }}/llvm/.cache
          key: release-downloads-windows-${{ hashFiles('Cargo.lock', 'third_party/renhdrum/Cargo.lock', 'scripts/renhdrum.py', 'builder/tools/pins.sh', 'tools.lock') }}
          restore-keys: release-downloads-windows-
      - name: llvm-mingw
        run: echo "LLVM_MINGW=$(python -I scripts/longshot_builder.py llvm-mingw "$RUNNER_TEMP/llvm" --host linux)" >> "$GITHUB_ENV"

      - name: Version
        run: echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # (the Linux longshot-builder this job runs, build-linux.yml's, before its pack: the third-party objects below, the
      # pack and its attaching, the dry run, the deltas and the manifest (`dev release`). An artifact of this run, made on
      # this runner by this commit's code; an artifact keeps no file mode)
      - name: The Linux longshot-builder (build-linux.yml's)
        uses: https://data.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e   # v4 (4.1.4 with the GHES check off)
        with:
          name: longshot-builder-linux-tool
          path: ${{ runner.temp }}/host
      - name: The Linux longshot-builder, runnable
        run: |
          chmod +x "$RUNNER_TEMP/host/longshot-builder"
          "$RUNNER_TEMP/host/longshot-builder" --version

      # (every tool the Windows and the Linux builder carry is in tools.lock, every line's first URLs Longshot's store's,
      # and every line's archive there with its size and SHA-256: checked here, with the Linux builder, before anything
      # is uploaded. A release uploads no tool: a line whose archive is not there yet is the Make tools workflow's to make
      # and upload. publish needs both builds, so a refusal here ships nothing)
      - name: The tools
        run: |
          TOOLS="$RUNNER_TEMP/host/longshot-builder dev tools"
          if ! $TOOLS check; then
            echo "::error::tools.lock lacks a tool a builder needs; docs/dev/reference/releases.md, Bumping a tool"
            exit 1
          fi
          if ! $TOOLS check --require; then
            echo "::error::a tools.lock line's archive is not in Longshot's store (above): a release uploads no tool. Run the Make tools workflow (Actions > Make tools, on main) for it, or fix the line; docs/dev/reference/releases.md, Bumping a tool"
            exit 1
          fi

      # (tools.lock's windows-x64 bundle, at tools/<name>/ of the checkout (`longshot-builder dev tools install`, by the
      # Linux longshot-builder above), where longshot-builder --root
      # <checkout> takes them (build-driver's tools), each archive checked by its size and SHA-256)
      - name: The build tools (tools.lock, windows-x64)
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev tools install "$PWD" --system windows-x64 --cache "$RUNNER_TEMP/tools-cache"
          echo "BUNDLE=$PWD" >> "$GITHUB_ENV"

      # (the third-party code's objects a player's build takes instead of compiling them (build-compile's prebuilt.rs): made
      # with the bundle's llvm-mingw and CPM cache, what a player's build compiles them with)
      # (each object whose key is the channel's newest release's taken from it, its SHA256SUMS signature checked first, as
      # build-linux.yml's: `dev release last-objects`; the rest compiled)
      - name: The third-party objects
        env:
          FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release last-objects --version "$TAG" --platform windows-x64 \
            --out "$RUNNER_TEMP/last-objects"
          last="$RUNNER_TEMP/last-objects/objects/third_party_objects"
          [ -f "$last/set.json" ] || last=0
          RX_TARGET=windows LONGSHOT_MINGW="$LLVM_MINGW" LONGSHOT_THIRD_PARTY_OBJECTS="$last" \
            "$RUNNER_TEMP/host/longshot-builder" compile --work "$RUNNER_TEMP/third-party-work" \
            --store "$RUNNER_TEMP/third-party-work/store" --root "$PWD" --jobs "$(nproc)" \
            --third-party-objects "$RUNNER_TEMP/third_party_objects"
      # (the game's Rust, longshot-rs over game/crates: liblongshot_rs.a with the pinned Rust, and beside it the key of the
      # sources it was built from, which a player's build checks before it links it instead of compiling Rust:
      # build-compile's rust.rs)
      - name: liblongshot_rs.a
        run: |
          python -I scripts/longshot_builder.py game-rust --target windows --cache "$RUNNER_TEMP/rust" \
            --out "$RUNNER_TEMP/longshot-rs/windows-x64"
          "$RUNNER_TEMP/host/longshot-builder" dev rust-key --root "$PWD" > "$RUNNER_TEMP/longshot-rs/windows-x64/sources.key"

      # (renhdrum.dll, the DualSense haptics' back end (host/haptic.c), from third_party/renhdrum with the pinned Rust and the
      # llvm-mingw above. --target windows: this runner is Linux)
      - name: renhdrum.dll
        run: >-
          python -I scripts/renhdrum.py build --target windows --llvm-mingw "$LLVM_MINGW" --cache "$RUNNER_TEMP/rust"
          --out "$RUNNER_TEMP/renhdrum/renhdrum.dll"

      # (the compiled Rust of the shipped builder's compile: cargo's target folder, kept for trusted runs only (a run of
      # main or a v* tag, on the server's release runner), by platform, profile, target and the pinned Rust
      # (scripts/renhdrum.py), then Cargo.lock; another Cargo.lock restores the newest entry of the same toolchain.
      # Unlike the downloads above, what it holds is not checked again: docs/dev/reference/ci.md, The release's cache)
      - name: Restore the shipped builder's compiled Rust (main's and tags' runs only)
        id: rust-target
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: https://github.com/actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-work/target
          key: release-rust-target-windows-dist-x86_64-pc-windows-gnullvm-${{ hashFiles('scripts/renhdrum.py') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-rust-target-windows-dist-x86_64-pc-windows-gnullvm-${{ hashFiles('scripts/renhdrum.py') }}-
      # (the program this release ships, the dist profile, compiled once, before it carries anything)
      - name: longshot-builder-<version>-windows-x64.exe, before its pack
        run: >-
          python -I scripts/longshot_builder.py build --target windows --profile dist --llvm-mingw "$LLVM_MINGW"
          --cache "$RUNNER_TEMP/rust" --out "$RUNNER_TEMP/longshot-builder.exe"
      - name: Save the shipped builder's compiled Rust (main's and tags' runs only)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-target.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rust-work/target
          key: release-rust-target-windows-dist-x86_64-pc-windows-gnullvm-${{ hashFiles('scripts/renhdrum.py') }}-${{ hashFiles('Cargo.lock') }}
      # (saved as soon as the last download is made (the game's Rust, RenHDrum's and the program's: the pinned Rust with
      # Windows' standard library, Cargo.lock's crates, RenHDrum's), not at the job's end: a later step that fails (the
      # Wine checks, the deltas) then leaves the next run its downloads, where it saved none and the next run fetched the
      # Rust and every crate again, one at a time. Its key names every pin of what it holds: the Rust (renhdrum.py), both
      # Cargo.locks, llvm-mingw (builder/tools/pins.sh) and tools.lock)
      - name: Save the release's downloads (each checked by its SHA-256 when used)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.release-cache.outputs.cache-hit != 'true'
        uses: https://github.com/actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust/*.tar.xz
            ${{ runner.temp }}/rust/crates
            ${{ runner.temp }}/tools-cache
            ${{ runner.temp }}/llvm/.cache
          key: release-downloads-windows-${{ hashFiles('Cargo.lock', 'third_party/renhdrum/Cargo.lock', 'scripts/renhdrum.py', 'builder/tools/pins.sh', 'tools.lock') }}
      # (what the program carries, each part a zstd member of its own (`longshot-builder dev release sources`), several
      # compressed at once, each whose raw bytes and zstd are the last release's taken from that release's pack, its
      # signed SHA256SUMS checked by `dev release last-objects` above (--reuse); then the
      # program, the dist profile, compiled once, the pack appended to it and read back (`dev release attach`); checked:
      # x86-64, Windows' own DLLs only)
      - name: longshot-builder-<version>-windows-x64.exe
        run: |
          command -v zstd > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd; }
          "$RUNNER_TEMP/host/longshot-builder" dev release sources --out "$RUNNER_TEMP/sources.pack" --version "$TAG" \
            --third-party-objects "$RUNNER_TEMP/third_party_objects" \
            --add "longshot-rs/prebuilt/windows-x64/liblongshot_rs.a=$RUNNER_TEMP/longshot-rs/windows-x64/liblongshot_rs.a" \
            --add "longshot-rs/prebuilt/windows-x64/sources.key=$RUNNER_TEMP/longshot-rs/windows-x64/sources.key" \
            --add "third_party/renhdrum/renhdrum.dll=$RUNNER_TEMP/renhdrum/renhdrum.dll" --tools "$BUNDLE/tools" \
            --reuse "$RUNNER_TEMP/last-objects/sources.pack"
          mkdir -p dist
          "$RUNNER_TEMP/host/longshot-builder" dev release attach "$RUNNER_TEMP/longshot-builder.exe" \
            "$RUNNER_TEMP/sources.pack" --out "dist/longshot-builder-$TAG-windows-x64.exe"
          python -I scripts/longshot_builder.py check "dist/longshot-builder-$TAG-windows-x64.exe"
          ls -l dist

      # (what it carries is complete: unpacked, then a player's Windows build's dry run over it, by the Linux longshot-builder:
      # a file the program does not carry, or a third-party object a player's build would compile, fails here)
      - name: A player's Windows build from what it carries
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release unpack "$RUNNER_TEMP/sources.pack" "$RUNNER_TEMP/carried"
          RX_TARGET=windows LONGSHOT_MINGW="$LLVM_MINGW" \
            "$RUNNER_TEMP/host/longshot-builder" dev release dry-run "$RUNNER_TEMP/host/longshot-builder" --root "$RUNNER_TEMP/carried" \
            --work "$RUNNER_TEMP/dry"

      # (the background install the Wine step started: its log, then its status; one that never ends stops here in 10 minutes)
      - name: Wine, installed
        run: |
          if [ ! -f "$RUNNER_TEMP/wine-apt.status" ]; then
            echo "::notice::waiting for the background install of Wine to end (up to 10 minutes)"
          fi
          for s in $(seq 600); do
            [ -f "$RUNNER_TEMP/wine-apt.status" ] && break
            [ $((s % 60)) = 0 ] && echo "still waiting for Wine's install: $((s / 60)) of 10 minutes"
            sleep 1
          done
          cat "$RUNNER_TEMP/wine-apt.log"
          [ -f "$RUNNER_TEMP/wine-apt.status" ] || { echo "::error::Wine's install did not end in 10 minutes"; exit 1; }
          status=$(cat "$RUNNER_TEMP/wine-apt.status")
          [ "$status" = 0 ] || { echo "::error::Wine's install failed ($status)"; exit 1; }
      # (the program starts on Windows and unpacks what it carries into an empty cache: under Wine, its first start timed)
      - name: Its first start, under Wine
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all WINEDLLOVERRIDES="mshtml="
          wine="$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)"
          "$wine" "dist/longshot-builder-$TAG-windows-x64.exe" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q "^longshot-builder " "$RUNNER_TEMP/version.txt"
          start=$(date +%s%N)
          "$wine" "dist/longshot-builder-$TAG-windows-x64.exe" sources --cache 'C:\longshot-cache'
          echo "first start: $(( ($(date +%s%N) - start) / 1000000 )) ms to unpack"
      # (dav1d for the AV1 movies is the bundle's CPM cache's: its library under the test of host/dav1d_av1.c, compiled with
      # the llvm-mingw above and run under Wine)
      - name: The bundle's dav1d, under Wine
        run: |
          dav1d=("$BUNDLE"/tools/cpm/dav1d/*)
          [ -f "${dav1d[0]}/lib/libdav1d.a" ] || { echo "::error::the bundle's cpm has no dav1d"; exit 1; }
          export WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all WINEDLLOVERRIDES="mshtml="
          python -I -B tests/test_dav1d_av1.py --cross "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" \
            --run "$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)" --dav1d "${dav1d[0]}"

      # (the release's stamps (the program run under Wine), the deltas from its channel's last releases and its manifest
      # for windows-x64; the bases are fetched through RELEASE_UPLOAD_API, the server without Cloudflare, when this runner
      # reaches it, else as anyone does)
      - name: The deltas and the manifest
        env:
          FORGEJO_UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all
          "$RUNNER_TEMP/host/longshot-builder" dev release files "dist/longshot-builder-$TAG-windows-x64.exe" --version "$TAG" \
            --platform windows-x64 --work "$RUNNER_TEMP/release" \
            --runner "$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)"

      # (RecompLauncher's release file: the same program as Longshot.exe, made a windowed one, and recomplauncher.json,
      # zipped by the Linux longshot-builder into dist/, so it travels with the rest and SHA256SUMS names it: the
      # deploy runner, which signs, builds and runs no Rust)
      - name: longshot-builder-<version>-windows-x64-recomplauncher.zip
        run: |
          "$RUNNER_TEMP/host/longshot-builder" dev release recomplauncher "dist/longshot-builder-$TAG-windows-x64.exe" --out dist
          ls -l dist

      # (an artifact goes to Forgejo by its public address, ROOT_URL, behind Cloudflare: a request there can fail once, and
      # the action does not send a block again. Sent once more when it failed: Forgejo takes the same name again)
      # (the uploads through the server's own address, RELEASE_UPLOAD_API's host on this runner's network, not git.magicbean.dev
      # behind Cloudflare, which cut a 306 MB upload with "tls alert bad record mac" (release run 54507): upload-artifact
      # talks to ACTIONS_RESULTS_URL, given here per step. When that fails, or the variable is unset, the upload goes the
      # usual way, then once more)
      # (zipped stored, compression-level 0: dist/ is compressed already (the program is mostly its zstd pack, the deltas
      # are zstd, RecompLauncher's zip holds the program), and zipping its 300 MB again at the default level took minutes
      # of the runner's 2 cores for almost nothing.)
      - name: The server's own address, for the uploads
        id: direct
        env:
          UPLOAD_API: ${{ vars.RELEASE_UPLOAD_API }}
        run: |
          if [[ $UPLOAD_API == http*://*/api/v1* ]]; then
            echo "url=${UPLOAD_API%%/api/v1*}/" >> "$GITHUB_OUTPUT"
            echo "uploads through ${UPLOAD_API%%/api/v1*}"
          else
            echo "::notice::no RELEASE_UPLOAD_API: the uploads go through the public address"
          fi
      - name: Upload longshot-builder-windows, through the server's own address
        id: upload_1_direct
        if: steps.direct.outputs.url != ''
        continue-on-error: true
        env:
          ACTIONS_RESULTS_URL: ${{ steps.direct.outputs.url }}
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-windows
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload longshot-builder-windows
        id: upload_1
        if: steps.direct.outputs.url == '' || steps.upload_1_direct.outcome == 'failure'
        continue-on-error: true
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-windows
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload longshot-builder-windows (again, the first try having failed)
        if: steps.upload_1.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e   # v4 (4.3.1 with the GHES check off; Forgejo's: GitHub's v4 and later refuse a server that is not github.com)
        with:
          name: longshot-builder-windows
          path: dist/
          if-no-files-found: error
          compression-level: 0
