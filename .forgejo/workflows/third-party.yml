# The third_party rule (CONTRIBUTING.md): its parts are unmodified upstream copies, with their notices in PROVENANCE.md, and a
# change goes in a new folder with its own note. scripts/check_third_party.py checks every part against the tree-sha256 its
# note records, and a pull request's changes against its base (a part changed without its note): that check is ci.yml's
# third-party job, on every pull request and push. This file is the nightly one: the parts whose notes name an upstream
# archive compared with that archive (or by hand). Standard library only; no game data is involved.
name: Third-party parts

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read


jobs:
  upstream:
    name: The same as upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every part with an upstream archive, compared with that archive
        run: python3 -I scripts/check_third_party.py --upstream
