# The build tools longshot-builder carries, which are not in the repository: linux-x64 for the Linux builder, windows-x64
# for the Windows one. The release unpacks each at its dest under the builder's bundle (longshot-builder dev tools
# install), where longshot-builder takes it (build-driver's tools/): nothing is downloaded on a player's PC. CI and
# developers install them the same way (mise run tools: tools/<name>), or dev.py does into its tools-store/. A change is
# a pull request that edits this file (docs/dev/reference/releases.md, "Bumping a tool").
#
#   tool <name> <version> <system> <sha256> <size> <dest> <prefix> <url> [<url> ...]
#
# Each archive is a .tar.zst of the tool's own files (prefix -), made from pinned sources and releases, the same bytes
# every time (builder/tools/make.sh: builder/tools/pins.sh's pins, a recipe per tool, packed by `longshot-builder dev
# tools make`): a file of the MagicBeanDev organization's generic package <name>-<system>, version <version> (its
# Packages tab), from Cloudflare's edge (https://git-cdn.magicbean.dev), then from git.magicbean.dev (the same path). A
# package version's files never change. The Make tools workflow (.forgejo/workflows/tools.yml, started by hand on main)
# makes an archive twice, uploads it and gives its line; a release only checks every line's archive is there.
#
#   llvm (linux-x64)          LLVM 23.1.5's release trimmed to what the compile uses: clang, lld (as ld.lld), clang's
#                             headers, the builtins and profile runtimes for x86-64 Linux (builder/tools/linux-x64/llvm.sh)
#   sysroot (linux-x64)       Ubuntu 22.04's glibc 2.35 and GCC 13's runtime pieces (linux-x64/sysroot.sh)
#   ffmpeg, sdl2, cpm         FFmpeg 9.0.2 with dav1d 1.5.4, static; SDL 2.32.10; the Vulkan, SPIR-V and VMA headers
#     (linux-x64)             (linux-x64/ffmpeg.sh, sdl2.sh, cpm.sh)
#   llvm-mingw (windows-x64)  llvm-mingw 20261104 (UCRT) trimmed to the x86-64 target (windows-x64/llvm-mingw.sh)
#   cpm (windows-x64)         the headers, dav1d 1.5.4 and FFmpeg 9.0.2 cross-built with llvm-mingw (windows-x64/cpm.sh)
#   sdl (windows-x64)         SDL3.dll 3.4.20 and SDL2.dll (sdl2-compat 2.32.74), libsdl's releases (windows-x64/sdl.sh)
