# The hook sites' definitions: what each site is and the contract of its callback (its form, shape, thread, arguments
# and answer), the same in every game build. Where each is in a build is that build's
# game/sites/<build id>/locations.toml; the host's flag and slot for each, a HOS_SITE line of game/sites.def.
# Read by the lifter (builder/crates/sites) when the game is lifted; the format, how to add a site and what one costs:
# docs/dev/reference/hooks.md. A site's place in this file is the order of several hooks at one instruction.
format = 2

# The Insert menu's Text speed and Text size (game/oot_text_step.c hos_text_letter_step).
[[site]]
name = "text.letterStep"
doc = "A text pane's letter animation is about to step: its letter count loaded, the letters' time in s0"
at = "after"
shape = "data"
thread = "worker"
args = ["x19:ptr:anim", "w9:u32:letters", "s0:f32:time"]

# Skip opening (host/hos_main.c hos_oot_opening, through game/oot_sites.c).
[[site]]
name = "opening.request"
doc = "A sequence asks for a one-shot event (x0 the request; the event's name at its arg + 6800)"
shape = "event"
thread = "worker"
args = ["x0:ptr:request"]

[[site]]
name = "opening.timeline"
doc = "An event's timeline is about to start; a callback that answers non-zero leaves it unstarted"
can_return = true
shape = "data"
thread = "worker"
args = ["x0:ptr:player"]

[[site]]
name = "opening.skipQuery"
doc = "Was the latest event skipped? A callback that answers non-zero has set x0 (the answer) itself"
can_return = true
shape = "data"
thread = "worker"
args = ["x0:ptr:query"]

# Skip title screen (game/oot_autoload.c, through game/oot_sites.c hos_site_menu_button_wait).
[[site]]
name = "menu.buttonWait"
doc = "A sequence node starts waiting for a press of a screen's button (x0 the node; its screen's name at [[x0 + 0xe8] & ~3])"
shape = "event"
thread = "worker"
args = ["x0:ptr:wait"]

[[site]]
name = "menu.buttonWaitNoDecideAnim"
doc = "A sequence node starts waiting for a press of a screen's button, its decide animation left out (x0 the node; its screen's name at [[x0 + 0xe8] & ~3])"
shape = "event"
thread = "worker"
args = ["x0:ptr:wait"]

# The save requests' trace and the Insert menu's Transition autosave (host/hos_main.c hos_oot_trace_save).
[[site]]
